spring:
  application:
    name: assetops-backend

  datasource:
    url: ${SPRING_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assetops}}
    username: ${DB_USER:assetops}
    password: ${DB_PASSWORD:assetops123}
    hikari:
      pool-name: AssetOpsPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      repositories:
        enabled: false



  session:
    store-type: none

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-threads: 50

jwt:
  secret: ${JWT_SECRET:dummy-dev-secret-key-change-it-in-production-settings}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  lifecycle:
    eol-warning-days: 60
    refresh-check-cron: "0 0 8 * * MON"
  gcp:
    project-id: ${GCP_PROJECT_ID:assetops-project}

logging:
  level:
    root: WARN
    com.assetops: INFO
    org.flywaydb: INFO
