name: AssetOps CI/CD → Cloud Run

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  BACKEND_SERVICE: assetops-backend
  FRONTEND_SERVICE: assetops-frontend
  AR_REPO: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/assetops

jobs:
  # ─── Test & Build Backend ────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assetops_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./backend
        run: ./mvnw test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/assetops_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  # ─── Test & Build Frontend ────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

  # ─── Build & Push Docker Images ──────────────────────────────
  build-and-push:
    name: Build & Push Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.image }}
      frontend-image: ${{ steps.meta-frontend.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Set image tags
        id: tags
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # Build Backend
      - name: Build backend image
        id: meta-backend
        run: |
          IMAGE="${{ env.AR_REPO }}/backend:${{ steps.tags.outputs.TAG }}"
          docker build -t $IMAGE ./backend
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # Build Frontend
      - name: Build frontend image
        id: meta-frontend
        run: |
          IMAGE="${{ env.AR_REPO }}/frontend:${{ steps.tags.outputs.TAG }}"
          docker build -t $IMAGE ./frontend
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ─── Deploy to Cloud Run ─────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          image: ${{ needs.build-and-push.outputs.backend-image }}
          region: ${{ env.REGION }}
          flags: |
            --min-instances=1
            --max-instances=10
            --memory=1Gi
            --cpu=1
            --concurrency=100
            --port=8080
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_INSTANCE }}
            --allow-unauthenticated
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
          secrets: |
            DB_URL=assetops-db-url:latest
            DB_USER=assetops-db-user:latest
            DB_PASSWORD=assetops-db-password:latest
            REDIS_HOST=assetops-redis-host:latest
            REDIS_PASSWORD=assetops-redis-password:latest
            KAFKA_BOOTSTRAP_SERVERS=assetops-kafka-servers:latest
            JWT_SECRET=assetops-jwt-secret:latest

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          image: ${{ needs.build-and-push.outputs.frontend-image }}
          region: ${{ env.REGION }}
          flags: |
            --min-instances=1
            --max-instances=5
            --memory=256Mi
            --cpu=1
            --concurrency=200
            --port=80
            --allow-unauthenticated

      - name: Get service URLs
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "✅ Backend:  $BACKEND_URL"
          echo "✅ Frontend: $FRONTEND_URL"

      - name: Notify deployment
        if: always()
        run: |
          STATUS=${{ job.status }}
          echo "Deployment $STATUS for commit ${{ github.sha }}"
