events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Upstream: use Docker Compose SERVICE NAME (not container_name)
    upstream api_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health endpoint for Docker HEALTHCHECK
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # ── WebSocket endpoint (must be before the generic /api/ block) ──
        # Spring STOMP WebSocket endpoint — must NOT intercept errors or the
        # HTTP→WS upgrade will fail.
        location = /api/ws {
            proxy_pass         http://api_backend/api/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Proxy API calls to backend container
        location /api/ {
            proxy_pass         http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;

            # Return JSON (not HTML) when backend is unreachable
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        # JSON fallback when backend is down (prevents "Unexpected token '<'" error)
        location @backend_unavailable {
            default_type application/json;
            return 503 '{"status":503,"error":"Service Unavailable","message":"Backend service is starting up or temporarily unavailable. Please try again in a moment.","detail":"Backend service is starting up or temporarily unavailable. Please try again in a moment."}';
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Angular SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
